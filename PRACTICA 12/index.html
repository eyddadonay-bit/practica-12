<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNEAKER VAULT - Práctica #12</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0f1115;
      color: #f3f4f6;
      line-height: 1.5;
    }

    /* Navegación */
    .navbar {
      background: #171a21;
      border-bottom: 1px solid #262b36;
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #fff;
    }

    .nav-links {
      display: flex;
      gap: 0.6rem;
    }

    .nav-btn {
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: 1px solid #2d3442;
      background: #1e232d;
      color: #e5e7eb;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav-btn.activo,
    .nav-btn:hover {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .oculto {
      display: none !important;
    }

    /* Buscador con lupa */
    .barra-cliente {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .buscador-box {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 460px;
    }

    .lupa {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
    }

    .buscador-input {
      width: 100%;
      padding: 0.65rem 0.85rem 0.65rem 2.4rem;
      border-radius: 10px;
      border: 1px solid #2d3442;
      background: #171a21;
      color: #fff;
      font-size: 0.95rem;
    }

    .buscador-input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .estado {
      color: #9ca3af;
      font-size: 0.92rem;
    }

    /* Grid catálogo */
    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: #171a21;
      border: 1px solid #262b36;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #3b82f6;
    }

    .card img {
      width: 100%;
      height: 185px;
      object-fit: cover;
      background: #222733;
    }

    .card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
    }

    .marca-cat {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #60a5fa;
      font-weight: 700;
    }

    .card h2 {
      font-size: 1.08rem;
    }

    .meta {
      font-size: 0.86rem;
      color: #cbd5e1;
    }

    .precio-stock {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.4rem;
    }

    .precio {
      font-size: 1.08rem;
      font-weight: 700;
      color: #34d399;
    }

    .stock {
      font-size: 0.8rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.15);
      color: #34d399;
    }

    .stock.agotado {
      background: rgba(248, 113, 113, 0.15);
      color: #f87171;
    }

    .compra-box {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      align-items: center;
    }

    .input-cant {
      width: 68px;
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid #2d3442;
      background: #0f1115;
      color: #fff;
      text-align: center;
      font-weight: 600;
    }

    .btn {
      padding: 0.55rem 0.8rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-comprar {
      flex: 1;
      background: #10b981;
      color: #06281e;
    }

    .btn-comprar:hover:not(:disabled) {
      background: #059669;
      color: #fff;
    }

    .btn-comprar:disabled {
      background: #374151;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .btn-detalle {
      margin-top: 0.45rem;
      width: 100%;
      background: #2563eb;
      color: #fff;
    }

    .btn-detalle:hover {
      background: #1d4ed8;
    }

    /* Admin y Login */
    .panel-box {
      background: #171a21;
      border: 1px solid #262b36;
      border-radius: 14px;
      padding: 1.5rem;
      max-width: 440px;
      margin: 2rem auto;
    }

    .admin-wrapper {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 860px) {
      .admin-wrapper {
        grid-template-columns: 1fr;
      }
    }

    .form-card {
      background: #171a21;
      border: 1px solid #262b36;
      border-radius: 14px;
      padding: 1.25rem;
    }

    .form-group {
      margin-bottom: 0.8rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 0.3rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.55rem 0.7rem;
      border-radius: 8px;
      border: 1px solid #2d3442;
      background: #0f1115;
      color: #fff;
      font-size: 0.92rem;
    }

    .btn-primario {
      width: 100%;
      background: #2563eb;
      color: #fff;
      padding: 0.65rem;
    }

    .btn-primario:hover {
      background: #1d4ed8;
    }

    .btn-secundario {
      width: 100%;
      background: #374151;
      color: #fff;
      padding: 0.55rem;
      margin-top: 0.45rem;
    }

    .btn-peligro {
      background: #dc2626;
      color: #fff;
    }

    .btn-peligro:hover {
      background: #b91c1c;
    }

    .btn-editar {
      background: #d97706;
      color: #fff;
    }

    .btn-editar:hover {
      background: #b45309;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 0.5rem;
    }

    .tabla-wrap {
      background: #171a21;
      border: 1px solid #262b36;
      border-radius: 14px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th, td {
      padding: 0.7rem 0.8rem;
      border-bottom: 1px solid #262b36;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #1e232d;
      color: #9ca3af;
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    .acciones-td {
      display: flex;
      gap: 0.4rem;
    }

    /* Toast mensaje */
    .toast {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      background: #1f2937;
      border: 1px solid #3b82f6;
      color: #fff;
      padding: 0.8rem 1.1rem;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
      z-index: 100;
      font-size: 0.9rem;
    }

    /* Modal GET por ID */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }

    .modal-contenido {
      background: #171a21;
      border: 1px solid #2d3442;
      border-radius: 14px;
      max-width: 520px;
      width: 100%;
      padding: 1.5rem;
      position: relative;
    }

    .btn-cerrar {
      position: absolute;
      top: 0.75rem;
      right: 1rem;
      background: transparent;
      border: none;
      color: #9ca3af;
      font-size: 1.75rem;
      cursor: pointer;
    }

    .detalle-img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 1rem;
    }

    .detalle-datos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      margin: 0.75rem 0;
      font-size: 0.92rem;
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="brand">SNEAKER VAULT</div>
    <div class="nav-links">
      <button id="btnVistaCatalogo" class="nav-btn activo">Catálogo</button>
      <button id="btnVistaAdmin" class="nav-btn">Panel de Administración</button>
    </div>
  </nav>

  <!-- VISTA CLIENTE: CATÁLOGO -->
  <main id="vistaCatalogo" class="container">
    <div class="barra-cliente">
      <div class="buscador-box">
        <span class="lupa">🔍</span>
        <input
          id="inputBuscar"
          class="buscador-input"
          type="text"
          placeholder="Buscar por nombre, marca, color o categoría..."
        />
      </div>
      <div id="estadoCatalogo" class="estado">Cargando catálogo...</div>
    </div>

    <section id="catalogo" class="catalogo"></section>
  </main>

  <!-- VISTA ADMIN: LOGIN + CRUD -->
  <section id="vistaAdmin" class="container oculto">
    <!-- Login por código -->
    <div id="loginBox" class="panel-box">
      <h2 style="margin-bottom: 0.4rem;">Login de Administración</h2>
      <p style="color: #9ca3af; font-size: 0.88rem; margin-bottom: 1rem;">
        Ingresa tus credenciales para gestionar el catálogo.
      </p>
      <form id="formLogin">
        <div class="form-group">
          <label for="loginUsuario">Usuario</label>
          <input id="loginUsuario" type="text" required placeholder="admin" />
        </div>
        <div class="form-group">
          <label for="loginClave">Contraseña / Código</label>
          <input id="loginClave" type="password" required placeholder="••••" />
        </div>
        <button type="submit" class="btn btn-primario">Ingresar al Panel</button>
      </form>
    </div>

    <!-- Panel CRUD (visible tras iniciar sesión) -->
    <div id="panelCrud" class="oculto">
      <div class="admin-header">
        <h2>Gestión de Tenis (CRUD)</h2>
        <button id="btnLogout" class="btn btn-peligro">Cerrar sesión</button>
      </div>

      <div class="admin-wrapper">
        <!-- Formulario Crear / Editar -->
        <div class="form-card">
          <h3 id="tituloForm" style="margin-bottom: 0.9rem;">Agregar nuevo tenis</h3>
          <form id="formProducto">
            <input type="hidden" id="editId" />

            <div class="form-group">
              <label for="NOMBRE">Nombre</label>
              <input id="NOMBRE" type="text" required placeholder="Ej. Puma Suede XL" />
            </div>

            <div class="form-group">
              <label for="MARCA">Marca</label>
              <input id="MARCA" type="text" required placeholder="Ej. Puma" />
            </div>

            <div class="form-group">
              <label for="TALLA">Talla</label>
              <input id="TALLA" type="number" required placeholder="Ej. 41" />
            </div>

            <div class="form-group">
              <label for="COLOR">Color</label>
              <input id="COLOR" type="text" required placeholder="Ej. Negro / Blanco" />
            </div>

            <div class="form-group">
              <label for="CATEGORIA">Categoría</label>
              <input id="CATEGORIA" type="text" required placeholder="Ej. Urbano" />
            </div>

            <div class="form-group">
              <label for="PRECIO">Precio (Bs)</label>
              <input id="PRECIO" type="number" min="1" required placeholder="Ej. 680" />
            </div>

            <div class="form-group">
              <label for="STOCK">Stock</label>
              <input id="STOCK" type="number" min="0" required placeholder="Ej. 12" />
            </div>

            <div class="form-group">
              <label for="IMAGEN">URL de Imagen</label>
              <input id="IMAGEN" type="url" placeholder="https://..." />
            </div>

            <div class="form-group">
              <label for="DESCRIPCION">Descripción</label>
              <textarea id="DESCRIPCION" rows="2" placeholder="Detalles del tenis..."></textarea>
            </div>

            <button type="submit" id="btnGuardarProducto" class="btn btn-primario">
              Guardar Tenis
            </button>
            <button type="button" id="btnCancelarEdicion" class="btn btn-secundario oculto">
              Cancelar edición
            </button>
          </form>
        </div>

        <!-- Tabla de productos para Editar / Eliminar -->
        <div class="tabla-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Marca</th>
                <th>Talla</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaAdminBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- Modal GET por ID -->
  <div id="modalDetalle" class="modal oculto" role="dialog" aria-modal="true">
    <div class="modal-contenido">
      <button id="cerrarModal" class="btn-cerrar" aria-label="Cerrar">&times;</button>
      <div id="detalleBody"></div>
    </div>
  </div>

  <!-- Notificación -->
  <div id="toast" class="toast oculto"></div>

  <script src="javascript.js"></script>
</body>
</html>
